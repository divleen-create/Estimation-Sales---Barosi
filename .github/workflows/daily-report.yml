name: Daily Sales Report

on:
  # Triggered daily at 11:30 IST by cron-job.org via the workflow_dispatch API.
  # GitHub's own schedule was removed on purpose: it fired late and unpredictably,
  # which would re-publish the report with different numbers later in the day.
  workflow_dispatch:

permissions:
  contents: write            # allow the job to push index.html back to the repo

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}   # used to gate the mismatch-email step

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pillow google-api-python-client google-auth

      - name: Pull live sheets (required)
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$GCP_SERVICE_ACCOUNT_KEY" ]; then
            echo "::error::GCP_SERVICE_ACCOUNT_KEY secret is empty or missing."
            exit 1
          fi
          printf '%s' "$GCP_SERVICE_ACCOUNT_KEY" > /tmp/key.json
          # Fail fast with a clear message if the secret isn't valid JSON.
          python -c "import json; json.load(open('/tmp/key.json')); print('Service-account key JSON is valid.')" \
            || { echo "::error::GCP_SERVICE_ACCOUNT_KEY is not valid JSON - re-paste the full key file."; exit 1; }
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/key.json
          python -c "import gsheets; gsheets.fetch_snapshots()"
          echo "Live sheets pulled successfully."

      - name: Build report
        # --strict: abort (non-zero exit) if the numbers don't reconcile against the
        # sheet's OWN totals / internal identities, so discrepant data is never published.
        run: python main.py --no-image --strict

      - name: Email on cross-sheet mismatch
        # Fires only when the build wrote output/sheet_conflicts.txt (the two source
        # sheets disagreed on a value; that channel was left blank in the report).
        # Skips silently if SMTP secrets aren't configured.
        if: ${{ hashFiles('output/sheet_conflicts.txt') != '' && env.SMTP_HOST != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Sales Report Bot <${{ secrets.SMTP_USERNAME }}>
          to: divleen@barosi.in
          subject: "⚠ Daily Sales Report — source-sheet value mismatch"
          body: |
            The two source sheets disagree on one or more values. Those channels were
            left BLANK in the report for the affected month(s) — please reconcile the
            sheets, then re-run the report. Details attached.
          attachments: output/sheet_conflicts.txt

      - name: Prepare QC email
        # Put the whole validation in the email BODY (not just the attachment) so
        # the numbers and edge cases are readable on a phone, and surface the
        # pass/fail verdict in the subject line.
        if: ${{ always() }}
        run: |
          if [ -f output/index_qc_summary.txt ]; then
            {
              echo "Daily QC validation for the sales report."
              echo "Full detail below (also attached): Excel-vs-output reconciliation per"
              echo "channel, internal identities, output-HTML check, parsing completeness,"
              echo "business edge cases (T-2 lag, sub-channel roll-up, two-sheet merge,"
              echo "no-bluffing), page structure, estimate freshness and sanity advisories."
              echo
              echo "Report: https://divleen-create.github.io/Estimation-Sales---Barosi/"
              echo "------------------------------------------------------------------"
              echo
              cat output/index_qc_summary.txt
            } > output/qc_email_body.txt
            echo "QC_VERDICT=$(grep -m1 '^Overall:' output/index_qc_summary.txt | sed 's/^Overall: //' || echo 'see body')" >> $GITHUB_ENV
          else
            mkdir -p output
            # Keep the attachment resolvable so the mail still sends on a failed build.
            printf '%s\n' \
              "DAILY QC VALIDATION — not produced." \
              "The build failed before the QC step ran; no numbers were validated and" \
              "nothing new was published (the last good report stays live)." \
              "Check the GitHub Actions log for this run." > output/index_qc_summary.txt
            cp output/index_qc_summary.txt output/qc_email_body.txt
            echo "QC_VERDICT=BUILD FAILED (no QC summary)" >> $GITHUB_ENV
          fi
          # HTML body (tables + colour). Fall back to the plain text if absent.
          if [ ! -f output/index_qc_summary.html ]; then
            printf '<p style="font:600 14px Arial;color:#a51f26">Daily QC validation could not be produced — the build failed before the QC step ran. Nothing new was published; the last good report stays live. Check the GitHub Actions log.</p>' > output/index_qc_summary.html
          fi

      - name: Email daily QC report
        # Runs even if the build failed — so the daily validation always lands.
        # Skips silently until SMTP secrets are configured.
        if: ${{ always() && env.SMTP_HOST != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Sales Report Bot <${{ secrets.SMTP_USERNAME }}>
          to: divleen@barosi.in
          subject: "Daily Sales Report — QC validation: ${{ env.QC_VERDICT }}"
          # html_body is what you read (headings, tables, colour-coded verdicts);
          # body is the plain-text alternative for clients that refuse HTML.
          html_body: file://output/index_qc_summary.html
          body: file://output/qc_email_body.txt
          attachments: output/index_qc_summary.txt

      - name: Commit and push updated report
        run: |
          cp output/index.html index.html   # Pages serves the repo-root index.html
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html                # output/ is a build artifact, not tracked
          git diff --cached --quiet || git commit -m "Auto-update daily report"
          git push origin HEAD:main
